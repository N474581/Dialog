<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dialog - 気づき・学びメモ</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f7f7f8;
    --card: #ffffff;
    --text: #1a1a1a;
    --muted: #6b7280;
    --border: #e5e7eb;
    --accent: #2563eb;
    --danger: #dc2626;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16171a;
      --card: #212226;
      --text: #f1f1f1;
      --muted: #9ca3af;
      --border: #33343a;
      --accent: #60a5fa;
      --danger: #f87171;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 24px 16px 80px; }
  h1 { font-size: 1.4rem; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 0.85rem; margin-bottom: 24px; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 16px;
  }
  label { display: block; font-size: 0.8rem; color: var(--muted); margin: 12px 0 4px; }
  input, textarea, select {
    width: 100%;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-size: 0.95rem;
    font-family: inherit;
  }
  textarea { min-height: 90px; resize: vertical; }
  button {
    cursor: pointer;
    border: none;
    border-radius: 8px;
    padding: 10px 16px;
    font-size: 0.9rem;
    font-weight: 600;
    background: var(--accent);
    color: white;
  }
  button.secondary { background: transparent; color: var(--muted); border: 1px solid var(--border); }
  button.danger { background: transparent; color: var(--danger); border: 1px solid var(--border); }
  .row { display: flex; gap: 8px; margin-top: 16px; }
  .row > button { flex: 1; }
  .toprow { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .entry {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 12px;
  }
  .entry-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .badge {
    font-size: 0.7rem;
    padding: 2px 8px;
    border-radius: 999px;
    background: var(--accent);
    color: white;
    flex-shrink: 0;
  }
  .badge.axis { background: #9333ea; }
  .badge.plan { background: #0891b2; }
  .entry-title { font-weight: 600; margin: 0; }
  .entry-content { white-space: pre-wrap; margin: 8px 0; font-size: 0.9rem; }
  .entry-meta { font-size: 0.75rem; color: var(--muted); display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .tags { display: flex; gap: 4px; flex-wrap: wrap; }
  .tag { font-size: 0.7rem; background: var(--bg); border: 1px solid var(--border); border-radius: 999px; padding: 2px 8px; color: var(--muted); }
  .tag.keep { background: #16a34a22; border-color: #16a34a55; color: #16a34a; }
  .tag.reduce { background: #dc262622; border-color: #dc262655; color: #dc2626; }
  .quick-tags { display: flex; gap: 8px; margin-top: 6px; }
  .quick-tag { flex: 1; padding: 8px; font-size: 0.85rem; font-weight: 500; background: transparent; border: 1px solid var(--border); color: var(--muted); }
  .quick-tag.keep.active { background: #16a34a22; border-color: #16a34a; color: #16a34a; }
  .quick-tag.reduce.active { background: #dc262622; border-color: #dc2626; color: #dc2626; }
  .error { color: var(--danger); font-size: 0.85rem; margin-top: 8px; }
  .success { color: #16a34a; font-size: 0.85rem; margin-top: 8px; }
  .empty { color: var(--muted); text-align: center; padding: 32px 0; font-size: 0.9rem; }
  [hidden] { display: none !important; }
  .axis-card { border: 1px solid #9333ea55; background: #9333ea11; }
  .axis-title { font-weight: 700; margin: 4px 0 8px; color: #9333ea; }
  .axis-content { white-space: pre-wrap; font-size: 0.9rem; }
  .axis-empty { color: var(--muted); font-size: 0.85rem; }
  .plan-result { white-space: pre-wrap; font-size: 0.9rem; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 12px; margin-top: 12px; }
  .search-row { margin-bottom: 16px; }
  .image-thumbs { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  .image-thumbs img { width: 72px; height: 72px; object-fit: cover; border-radius: 8px; border: 1px solid var(--border); }
  .entry-images { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0; }
  .entry-images img { width: 96px; height: 96px; object-fit: cover; border-radius: 8px; border: 1px solid var(--border); cursor: pointer; }
  .chat-messages { display: flex; flex-direction: column; gap: 10px; max-height: 360px; overflow-y: auto; margin-bottom: 8px; }
  .msg { padding: 10px 12px; border-radius: 12px; font-size: 0.9rem; white-space: pre-wrap; max-width: 85%; }
  .msg.user { align-self: flex-end; background: var(--accent); color: white; }
  .msg.assistant { align-self: flex-start; background: var(--bg); border: 1px solid var(--border); }
  .chat-input-row { display: flex; gap: 8px; }
  .chat-input-row textarea { min-height: 44px; flex: 1; }
  .chat-input-row button { flex-shrink: 0; }
</style>
</head>
<body>
<div class="wrap">
  <div class="toprow">
    <div>
      <h1>Dialog</h1>
      <div class="sub">日々の気づき・学びを保存するメモ</div>
    </div>
    <button id="signOutBtn" class="secondary" hidden>サインアウト</button>
  </div>

  <!-- ログイン画面（本人専用。登録機能はなし） -->
  <div id="authCard" class="card">
    <label for="password">パスワード</label>
    <input id="password" type="password" autocomplete="current-password" placeholder="パスワード" />
    <div class="row">
      <button id="signInBtn">サインイン</button>
    </div>
    <div id="authMsg" class="error" hidden></div>
  </div>

  <!-- 自分の軸 -->
  <div id="axisCard" class="card axis-card" hidden>
    <div class="toprow" style="margin-bottom: 4px;">
      <strong style="font-size:0.95rem;">あなたの軸</strong>
      <button id="axisRefreshBtn" class="secondary">ふりかえる</button>
    </div>
    <div id="axisBody"></div>
    <div id="axisMsg" class="error" hidden></div>
  </div>

  <!-- Claudeとの壁打ち -->
  <div id="chatCard" class="card" hidden>
    <div class="toprow" style="margin-bottom: 8px;">
      <strong style="font-size:0.95rem;">Claudeと話す</strong>
      <button id="chatResetBtn" class="secondary">会話をリセット</button>
    </div>
    <div id="chatMessages" class="chat-messages"></div>
    <div class="chat-input-row">
      <textarea id="chatInput" placeholder="思ったことを話してみてください"></textarea>
      <button id="chatSendBtn">送信</button>
    </div>
    <div class="row">
      <button id="chatSummarizeBtn" class="secondary" disabled>この対話を保存する</button>
    </div>
    <div id="chatMsg" class="error" hidden></div>
  </div>

  <!-- スケジュール相談 -->
  <div id="scheduleCard" class="card" hidden>
    <strong style="font-size:0.95rem;">スケジュールを相談する</strong>
    <label for="scheduleGoal">達成したいこと</label>
    <input id="scheduleGoal" type="text" placeholder="例: FGOの夢見の回廊イベントをクリアしたい" />
    <label for="scheduleDeadline">締切（任意）</label>
    <input id="scheduleDeadline" type="date" />
    <label for="scheduleConstraints">制約・すでにある予定（任意）</label>
    <textarea id="scheduleConstraints" placeholder="例: 平日は21時以降1時間、休日は3時間ほど使える"></textarea>
    <div class="row">
      <button id="scheduleGenerateBtn">スケジュールを作ってもらう</button>
    </div>
    <div id="scheduleResult" class="plan-result" hidden></div>
    <div class="row" id="scheduleSaveRow" hidden>
      <button id="scheduleSaveBtn" class="secondary">この内容で保存する</button>
    </div>
    <div id="scheduleMsg" class="error" hidden></div>
  </div>

  <!-- 投稿フォーム -->
  <div id="formCard" class="card" hidden>
    <label for="entryType">種類</label>
    <select id="entryType">
      <option value="insight">気づき</option>
      <option value="learning">学び</option>
    </select>
    <label for="title">タイトル</label>
    <input id="title" type="text" placeholder="一言で" />
    <label for="content">内容</label>
    <textarea id="content" placeholder="詳しく書く"></textarea>
    <label for="tags">タグ（カンマ区切り）</label>
    <input id="tags" type="text" placeholder="仕事, 読書" />
    <div class="quick-tags">
      <button type="button" class="quick-tag keep" data-tag="続けたい">続けたい</button>
      <button type="button" class="quick-tag reduce" data-tag="減らしたい">減らしたい</button>
    </div>
    <label for="source">きっかけ（任意）</label>
    <input id="source" type="text" placeholder="本、会話、経験など" />
    <label for="images">写真・イラスト（任意）</label>
    <input id="images" type="file" accept="image/*" multiple />
    <div id="imagePreview" class="image-thumbs"></div>
    <div class="row">
      <button id="submitBtn">保存する</button>
    </div>
    <div id="formMsg" class="error" hidden></div>
  </div>

  <div class="search-row">
    <input id="searchInput" type="text" placeholder="キーワードやタグで検索" />
  </div>

  <div id="list"></div>
</div>

<script>
const SUPABASE_URL = "https://gyuhvbkfsxkrbzjfpbgv.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd5dWh2Ymtmc3hrcmJ6amZwYmd2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg3NDc0NjQsImV4cCI6MjEwNDMyMzQ2NH0.6nXECoYTKRbRH_oaoMSluidplIu642dUj7jJq_gV-vs";

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const authCard = document.getElementById("authCard");
const formCard = document.getElementById("formCard");
const signOutBtn = document.getElementById("signOutBtn");
const authMsg = document.getElementById("authMsg");
const formMsg = document.getElementById("formMsg");
const listEl = document.getElementById("list");

function showAuthMsg(text) {
  authMsg.textContent = text;
  authMsg.hidden = !text;
}
function showFormMsg(text) {
  formMsg.textContent = text;
  formMsg.hidden = !text;
}

const OWNER_EMAIL = "howling_juntas_06@icloud.com";

document.getElementById("signInBtn").addEventListener("click", async () => {
  showAuthMsg("");
  const password = document.getElementById("password").value;
  const { error } = await sb.auth.signInWithPassword({ email: OWNER_EMAIL, password });
  if (error) showAuthMsg(error.message);
});

document.getElementById("password").addEventListener("keydown", (e) => {
  if (e.key === "Enter") document.getElementById("signInBtn").click();
});

signOutBtn.addEventListener("click", async () => {
  await sb.auth.signOut();
});

const tagsInput = document.getElementById("tags");

function getTagList() {
  return tagsInput.value.split(",").map(t => t.trim()).filter(Boolean);
}

function syncQuickTagButtons() {
  const current = getTagList();
  document.querySelectorAll(".quick-tag").forEach(btn => {
    btn.classList.toggle("active", current.includes(btn.dataset.tag));
  });
}

document.querySelectorAll(".quick-tag").forEach(btn => {
  btn.addEventListener("click", () => {
    const tag = btn.dataset.tag;
    let current = getTagList();
    if (current.includes(tag)) {
      current = current.filter(t => t !== tag);
    } else {
      current.push(tag);
    }
    tagsInput.value = current.join(", ");
    syncQuickTagButtons();
  });
});

tagsInput.addEventListener("input", syncQuickTagButtons);

const imagesInput = document.getElementById("images");
const imagePreview = document.getElementById("imagePreview");
let selectedImageFiles = [];

imagesInput.addEventListener("change", () => {
  selectedImageFiles = Array.from(imagesInput.files || []);
  imagePreview.innerHTML = selectedImageFiles
    .map(f => `<img src="${URL.createObjectURL(f)}" alt="${escapeHtml(f.name)}" />`)
    .join("");
});

async function uploadSelectedImages() {
  const paths = [];
  for (const file of selectedImageFiles) {
    const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g, "_");
    const path = `${Date.now()}-${Math.random().toString(36).slice(2, 8)}-${safeName}`;
    const { error } = await sb.storage.from("learning-media").upload(path, file, { contentType: file.type });
    if (error) throw new Error(`画像のアップロードに失敗しました: ${error.message}`);
    paths.push(path);
  }
  return paths;
}

document.getElementById("submitBtn").addEventListener("click", async () => {
  showFormMsg("");
  const entry_type = document.getElementById("entryType").value;
  const title = document.getElementById("title").value.trim();
  const content = document.getElementById("content").value.trim();
  const tagsRaw = document.getElementById("tags").value.trim();
  const source = document.getElementById("source").value.trim() || null;
  const tags = tagsRaw ? tagsRaw.split(",").map(t => t.trim()).filter(Boolean) : [];

  if (!title || !content) {
    showFormMsg("タイトルと内容は必須です。");
    return;
  }

  const submitBtn = document.getElementById("submitBtn");
  submitBtn.disabled = true;
  try {
    const image_paths = await uploadSelectedImages();
    const { error } = await sb.from("learnings").insert({ entry_type, title, content, tags, source, image_paths });
    if (error) throw new Error(error.message);

    document.getElementById("title").value = "";
    document.getElementById("content").value = "";
    document.getElementById("tags").value = "";
    document.getElementById("source").value = "";
    imagesInput.value = "";
    selectedImageFiles = [];
    imagePreview.innerHTML = "";
    syncQuickTagButtons();
    await loadEntries();
  } catch (e) {
    showFormMsg(e.message);
  } finally {
    submitBtn.disabled = false;
  }
});

const chatCard = document.getElementById("chatCard");
const chatMessagesEl = document.getElementById("chatMessages");
const chatInput = document.getElementById("chatInput");
const chatSendBtn = document.getElementById("chatSendBtn");
const chatSummarizeBtn = document.getElementById("chatSummarizeBtn");
const chatMsg = document.getElementById("chatMsg");
let chatHistory = [];

function showChatMsg(text, kind) {
  chatMsg.textContent = text;
  chatMsg.hidden = !text;
  chatMsg.className = kind === "success" ? "success" : "error";
}

function renderChat() {
  chatMessagesEl.innerHTML = chatHistory.map(m =>
    `<div class="msg ${m.role === "user" ? "user" : "assistant"}">${escapeHtml(m.content)}</div>`
  ).join("");
  chatMessagesEl.scrollTop = chatMessagesEl.scrollHeight;
  chatSummarizeBtn.disabled = chatHistory.length === 0;
}

async function callChatFunction(action) {
  const { data, error } = await sb.functions.invoke("chat-with-claude", {
    body: { action, messages: chatHistory },
  });
  if (error) throw new Error(error.message || "Claudeとの通信に失敗しました");
  if (data?.error) throw new Error(data.error);
  return data;
}

chatSendBtn.addEventListener("click", async () => {
  const text = chatInput.value.trim();
  if (!text) return;
  showChatMsg("");
  chatHistory.push({ role: "user", content: text });
  chatInput.value = "";
  renderChat();
  chatSendBtn.disabled = true;
  try {
    const data = await callChatFunction("chat");
    chatHistory.push({ role: "assistant", content: data.reply });
    renderChat();
  } catch (e) {
    showChatMsg(e.message);
    chatHistory.pop();
    renderChat();
  } finally {
    chatSendBtn.disabled = false;
  }
});

chatInput.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    chatSendBtn.click();
  }
});

document.getElementById("chatResetBtn").addEventListener("click", () => {
  chatHistory = [];
  showChatMsg("");
  renderChat();
});

chatSummarizeBtn.addEventListener("click", async () => {
  showChatMsg("");
  chatSummarizeBtn.disabled = true;
  try {
    const data = await callChatFunction("summarize");
    const entry = data.entry;
    const { error } = await sb.from("learnings").insert({
      entry_type: entry.entry_type === "learning" ? "learning" : "insight",
      title: entry.title || "",
      content: entry.content || "",
      tags: entry.tags || [],
      source: entry.source || "Claudeとの壁打ち",
    });
    if (error) throw new Error(error.message);

    chatHistory = [];
    renderChat();
    showChatMsg(`保存しました:「${entry.title}」`, "success");
    await loadEntries();
  } catch (e) {
    showChatMsg(e.message);
  } finally {
    chatSummarizeBtn.disabled = false;
  }
});

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

const ENTRY_TYPE_LABELS = { insight: "気づき", learning: "学び", axis: "軸", plan: "予定" };
let allEntries = [];
let imageUrlCache = {};

async function loadSignedImageUrls(entries) {
  const allPaths = entries.flatMap(e => e.image_paths || []);
  if (allPaths.length === 0) return;
  const { data, error } = await sb.storage.from("learning-media").createSignedUrls(allPaths, 3600);
  if (error || !data) return;
  data.forEach(item => {
    if (item.signedUrl) imageUrlCache[item.path] = item.signedUrl;
  });
}

async function loadEntries() {
  const { data, error } = await sb
    .from("learnings")
    .select("*")
    .order("created_at", { ascending: false });

  if (error) {
    listEl.innerHTML = `<div class="error">${escapeHtml(error.message)}</div>`;
    return;
  }

  allEntries = data || [];
  await loadSignedImageUrls(allEntries);
  renderEntryList();
}

function renderEntryList() {
  const query = searchInput.value.trim().toLowerCase();
  const filtered = query
    ? allEntries.filter(e => {
        const haystack = [e.title, e.content, ...(e.tags || [])].join(" ").toLowerCase();
        return haystack.includes(query);
      })
    : allEntries;

  if (filtered.length === 0) {
    listEl.innerHTML = query
      ? `<div class="empty">一致する記録が見つかりませんでした。</div>`
      : `<div class="empty">まだ記録がありません。最初の気づき・学びを保存してみましょう。</div>`;
    return;
  }

  listEl.innerHTML = filtered.map(entry => {
    const label = ENTRY_TYPE_LABELS[entry.entry_type] || entry.entry_type;
    const badgeCls = entry.entry_type === "axis" ? " axis" : entry.entry_type === "plan" ? " plan" : "";
    const tags = (entry.tags || []).map(t => {
      const cls = t === "続けたい" ? " keep" : t === "減らしたい" ? " reduce" : "";
      return `<span class="tag${cls}">#${escapeHtml(t)}</span>`;
    }).join("");
    const images = (entry.image_paths || [])
      .filter(p => imageUrlCache[p])
      .map(p => `<img src="${imageUrlCache[p]}" alt="添付画像" />`)
      .join("");
    const date = new Date(entry.created_at).toLocaleString("ja-JP");
    return `
      <div class="entry" data-id="${entry.id}">
        <div class="entry-head">
          <p class="entry-title">${escapeHtml(entry.title)}</p>
          <span class="badge${badgeCls}">${label}</span>
        </div>
        <p class="entry-content">${escapeHtml(entry.content)}</p>
        ${images ? `<div class="entry-images">${images}</div>` : ""}
        <div class="entry-meta">
          <div class="tags">${tags}</div>
          <div style="display:flex; gap:8px; align-items:center;">
            <span>${date}${entry.source ? " ・ " + escapeHtml(entry.source) : ""}</span>
            <button class="danger delete-btn" data-id="${entry.id}">削除</button>
          </div>
        </div>
      </div>
    `;
  }).join("");

  listEl.querySelectorAll(".delete-btn").forEach(btn => {
    btn.addEventListener("click", async () => {
      const id = btn.getAttribute("data-id");
      if (!confirm("この記録を削除しますか？")) return;
      const { error } = await sb.from("learnings").delete().eq("id", id);
      if (error) alert(error.message);
      else loadEntries();
    });
  });
}

const searchInput = document.getElementById("searchInput");
searchInput.addEventListener("input", renderEntryList);

const axisCard = document.getElementById("axisCard");
const axisBody = document.getElementById("axisBody");
const axisMsg = document.getElementById("axisMsg");
const axisRefreshBtn = document.getElementById("axisRefreshBtn");

function showAxisMsg(text) {
  axisMsg.textContent = text;
  axisMsg.hidden = !text;
}

async function loadAxis() {
  const { data, error } = await sb
    .from("learnings")
    .select("*")
    .eq("entry_type", "axis")
    .order("created_at", { ascending: false })
    .limit(1);

  if (error || !data || data.length === 0) {
    axisBody.innerHTML = `<div class="axis-empty">まだ「軸」は見つかっていません。記録がある程度たまったら「ふりかえる」を押してみてください。</div>`;
    return;
  }

  const axis = data[0];
  axisBody.innerHTML = `
    <p class="axis-title">${escapeHtml(axis.title)}</p>
    <p class="axis-content">${escapeHtml(axis.content)}</p>
    <p style="font-size:0.75rem; color: var(--muted); margin-top: 8px;">${new Date(axis.created_at).toLocaleDateString("ja-JP")}時点のふりかえり</p>
  `;
}

axisRefreshBtn.addEventListener("click", async () => {
  showAxisMsg("");
  axisRefreshBtn.disabled = true;
  try {
    const { data, error } = await sb
      .from("learnings")
      .select("created_at, entry_type, title, content, tags")
      .neq("entry_type", "axis")
      .order("created_at", { ascending: false })
      .limit(200);
    if (error) throw new Error(error.message);
    if (!data || data.length === 0) {
      showAxisMsg("まずは気づき・学びをいくつか記録してみてください。");
      return;
    }

    const { data: fnData, error: fnError } = await sb.functions.invoke("chat-with-claude", {
      body: { action: "reflect", entries: data },
    });
    if (fnError) throw new Error(fnError.message || "Claudeとの通信に失敗しました");
    if (fnData?.error) throw new Error(fnData.error);

    const axis = fnData.axis;
    const { error: insertError } = await sb.from("learnings").insert({
      entry_type: "axis",
      title: axis.title,
      content: axis.content,
      tags: ["軸"],
      source: "Claudeとの振り返り",
    });
    if (insertError) throw new Error(insertError.message);

    await loadAxis();
    await loadEntries();
  } catch (e) {
    showAxisMsg(e.message);
  } finally {
    axisRefreshBtn.disabled = false;
  }
});

const scheduleCard = document.getElementById("scheduleCard");
const scheduleGoal = document.getElementById("scheduleGoal");
const scheduleDeadline = document.getElementById("scheduleDeadline");
const scheduleConstraints = document.getElementById("scheduleConstraints");
const scheduleGenerateBtn = document.getElementById("scheduleGenerateBtn");
const scheduleResult = document.getElementById("scheduleResult");
const scheduleSaveRow = document.getElementById("scheduleSaveRow");
const scheduleSaveBtn = document.getElementById("scheduleSaveBtn");
const scheduleMsg = document.getElementById("scheduleMsg");
let currentPlanText = "";

function showScheduleMsg(text) {
  scheduleMsg.textContent = text;
  scheduleMsg.hidden = !text;
}

scheduleGenerateBtn.addEventListener("click", async () => {
  showScheduleMsg("");
  const goal = scheduleGoal.value.trim();
  if (!goal) {
    showScheduleMsg("達成したいことを入力してください。");
    return;
  }
  scheduleGenerateBtn.disabled = true;
  scheduleResult.hidden = true;
  scheduleSaveRow.hidden = true;
  scheduleResult.textContent = "考え中です…（web検索を行う場合、数十秒かかることがあります）";
  scheduleResult.hidden = false;
  try {
    const { data, error } = await sb.functions.invoke("chat-with-claude", {
      body: {
        action: "schedule",
        goal,
        deadline: scheduleDeadline.value || "",
        constraints: scheduleConstraints.value.trim(),
      },
    });
    if (error) throw new Error(error.message || "Claudeとの通信に失敗しました");
    if (data?.error) throw new Error(data.error);

    currentPlanText = data.plan;
    scheduleResult.textContent = currentPlanText;
    scheduleSaveRow.hidden = false;
  } catch (e) {
    scheduleResult.hidden = true;
    showScheduleMsg(e.message);
  } finally {
    scheduleGenerateBtn.disabled = false;
  }
});

scheduleSaveBtn.addEventListener("click", async () => {
  showScheduleMsg("");
  scheduleSaveBtn.disabled = true;
  try {
    const goal = scheduleGoal.value.trim();
    const { error } = await sb.from("learnings").insert({
      entry_type: "plan",
      title: goal.length > 40 ? goal.slice(0, 40) + "…" : goal,
      content: currentPlanText,
      tags: ["予定"],
      source: "Claudeとのスケジュール相談",
    });
    if (error) throw new Error(error.message);

    scheduleGoal.value = "";
    scheduleDeadline.value = "";
    scheduleConstraints.value = "";
    currentPlanText = "";
    scheduleResult.hidden = true;
    scheduleSaveRow.hidden = true;
    await loadEntries();
  } catch (e) {
    showScheduleMsg(e.message);
  } finally {
    scheduleSaveBtn.disabled = false;
  }
});

function setLoggedIn(loggedIn) {
  authCard.hidden = loggedIn;
  axisCard.hidden = !loggedIn;
  chatCard.hidden = !loggedIn;
  scheduleCard.hidden = !loggedIn;
  formCard.hidden = !loggedIn;
  signOutBtn.hidden = !loggedIn;
  if (loggedIn) {
    loadEntries();
    loadAxis();
  } else {
    listEl.innerHTML = "";
  }
}

sb.auth.onAuthStateChange((_event, session) => {
  setLoggedIn(!!session);
});

sb.auth.getSession().then(({ data }) => {
  setLoggedIn(!!data.session);
});
</script>
</body>
</html>
